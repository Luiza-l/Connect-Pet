<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="connectPetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0369A1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo em Squircle Azul ConnectPet -->
  <rect width="64" height="64" rx="16" fill="url(#connectPetGrad)" />

  <!-- Patinha ConnectPet em Branco Puro -->
  <g fill="#FFFFFF" filter="url(#softGlow)">
    <!-- 4 Dedinhos / Almofadinhas -->
    <ellipse cx="18" cy="25" rx="4.5" ry="6.5" transform="rotate(-20 18 25)" />
    <ellipse cx="27" cy="18" rx="4.8" ry="7" transform="rotate(-7 27 18)" />
    <ellipse cx="37" cy="18" rx="4.8" ry="7" transform="rotate(7 37 18)" />
    <ellipse cx="46" cy="25" rx="4.5" ry="6.5" transform="rotate(20 46 25)" />
    
    <!-- Almofada Central em Formato de Coração/Pata -->
    <path d="M32 33 C27.5 30 19 32.5 19 40.5 C19 47 24.5 51 32 51 C39.5 51 45 47 45 40.5 C45 32.5 36.5 30 32 33 Z" />
  </g>
</svg>
